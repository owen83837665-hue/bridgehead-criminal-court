
name: Inspect Judicial Court Website

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check judicial website DNS
        run: |
          python - <<'PY'
          import socket
          import time

          host = "di3.judicial.gov.tw"

          for attempt in range(6):
              try:
                  result = socket.getaddrinfo(
                      host, 443, type=socket.SOCK_STREAM
                  )
                  print("DNS resolution successful:")
                  print(result)
                  break
              except socket.gaierror as e:
                  print(f"DNS attempt {attempt + 1} failed: {e}")
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Inspect court website
        run: |
          python inspect_court_page.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-inspection-report
          path: "*.json"
          if-no-files-found: ignore
