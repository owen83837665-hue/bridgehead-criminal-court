
name: Inspect Judicial Court Website

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check judicial website DNS
        run: |
          python - <<'PY'
          import socket

          hosts = [
              "github.com",
              "google.com",
              "judicial.gov.tw",
              "di3.judicial.gov.tw"
          ]

          for host in hosts:
              try:
                  result = socket.getaddrinfo(
                      host, 443,
                      type=socket.SOCK_STREAM
                  )
                  print(f"SUCCESS: {host}")
                  print(result[0][4])
              except socket.gaierror as e:
                  print(f"FAILED: {host} - {e}")
          PY
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Inspect court website
        run: |
          python inspect_court_page.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-inspection-report
          path: "*.json"
          if-no-files-found: ignore
